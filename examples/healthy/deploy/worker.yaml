apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: registry.example.com/shop/worker:1.4.2
          envFrom:
            - configMapRef:
                name: worker-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: shop
data:
  DATABASE_URL: postgres://app@shop-db-rw:5432/app?sslmode=require&pool_max_conns=5
